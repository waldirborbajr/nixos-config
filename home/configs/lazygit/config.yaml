disableStartupPopups: true
git:
  diffRenderers:
  - colorArg: always
    command: delta --dark --paging=never --line-numbers --hunk-header-style="file
      omit-code-fragment" --file-style="omit" --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
gui:
  authorColors:
    '*': '#b4befe'
  theme:
    activeBorderColor:
    - '#cba6f7'
    - bold
    cherryPickedCommitBgColor:
    - '#45475a'
    cherryPickedCommitFgColor:
    - '#cba6f7'
    defaultFgColor:
    - '#cdd6f4'
    inactiveBorderColor:
    - '#a6adc8'
    optionsTextColor:
    - '#89b4fa'
    searchingActiveBorderColor:
    - '#f9e2af'
    selectedLineBgColor:
    - '#313244'
    unstagedChangesColor:
    - '#f38ba8'
quitOnTopLevelReturn: true
