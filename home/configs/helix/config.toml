# ══════════════════════════════════════════════════════════════════════
#  Helix Configuration
#  Nord theme — Linux x86_64 + macOS Apple Silicon (M2)
#  Fonte controlada pelo WezTerm (não pelo Helix)
# ══════════════════════════════════════════════════════════════════════

# ====================== THEME ======================

theme = "onenord"


# ====================== EDITOR ======================

[editor]
true-color = true
auto-format = true
bufferline = "multiple"
mouse = true
line-number = "relative"
cursorline = true
color-modes = true
idle-timeout = 50
scroll-lines = 3
scrolloff = 8
text-width = 100

gutters = [
  "diff",
  "diagnostics",
  "line-numbers",
  "spacer",
]

end-of-line-diagnostics = "hint"

trim-trailing-whitespace = true
trim-final-newlines = true
continue-comments = false

completion-trigger-len = 1
completion-replace = true


# ====================== AUTO SAVE ======================

[editor.auto-save]
focus-lost = true

[editor.auto-save.after-delay]
enable = true
timeout = 1500


# ====================== DIAGNOSTICS ======================

[editor.inline-diagnostics]
cursor-line = "error"
other-lines = "warning"


# ====================== CURSOR ======================

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"


# ====================== STATUSLINE ======================

[editor.statusline]
left = [
  "mode",
  "spinner",
  "version-control",
  "file-name",
]

center = [
  "file-base-name",
  "read-only-indicator",
  "file-modification-indicator",
]

right = [
  "diagnostics",
  "selections",
  "primary-selection-length",
  "position-percentage",
  "position",
  "total-line-numbers",
  "file-encoding",
  "file-type",
]

separator = "│"


# ====================== LSP ======================

[editor.lsp]
enable = true
display-messages = true
display-inlay-hints = true
snippets = true
auto-signature-help = true
goto-reference-include-declaration = true


# ====================== SOFT WRAP ======================

[editor.soft-wrap]
enable = true
max-wrap = 25
max-indent-retain = 0
wrap-indicator = "↪ "


# ====================== INDENT GUIDES ======================

[editor.indent-guides]
render = true
character = "▏"


# ====================== FILE PICKER ======================

[editor.file-picker]
hidden = true
parents = true
git-ignore = true
git-global = true
git-exclude = true


# ==========================================================
# KEYBINDINGS
# ==========================================================

[keys.normal]

# Redo
"U" = "redo"


# ====================== LAZYGIT ======================

# Ctrl+G
"C-g" = ":sh wezterm cli spawn --new-window lazygit"


# ====================== YAZI ======================

# Ctrl+Y
"C-y" = [
  ":sh rm -f /tmp/helix-yazi-chooser",
  ":insert-output yazi %{buffer_name} --chooser-file=/tmp/helix-yazi-chooser",
  ":open %sh{cat /tmp/helix-yazi-chooser}",
  ":redraw",
]


# ====================== UNIVERSAL RUNNER ======================

# Shift+R
# Detecta automaticamente Rust ou Go
"R" = [
  ":sh if [ -f Cargo.toml ]; then cargo run; elif [ -f go.mod ]; then go run .; else echo 'No project detected'; fi > /tmp/helix-universal-output.txt 2>&1 || true",
  ":open /tmp/helix-universal-output.txt",
]


# ====================== KAKOUNE-STYLE EXTEND (maiúscula = seleção) ======================

H = "extend_char_left"
L = "extend_char_right"
J = ["extend_line_down", "extend_to_line_bounds"]
K = ["extend_line_up", "extend_to_line_bounds"]
B = "extend_prev_word_start"
W = "extend_next_word_start"
E = "extend_next_word_end"
T = "extend_till_char"
F = "extend_next_char"
N = "extend_search_next"

"A-b" = "move_prev_long_word_start"
"A-B" = "extend_prev_long_word_start"
"A-w" = "move_next_long_word_start"
"A-W" = "extend_next_long_word_start"
"A-e" = "move_next_long_word_end"
"A-E" = "extend_next_long_word_end"
"A-t" = "till_prev_char"
"A-f" = "find_prev_char"
"A-T" = "extend_till_prev_char"
"A-F" = "extend_prev_char"
"A-l" = "extend_to_line_end"
"A-h" = "extend_to_line_start"
"A-d" = "delete_selection"
"A-n" = "search_prev"
"A-N" = "extend_search_prev"
"A-j" = "join_selections"
"A-k" = "keep_selections"


# ====================== EDIÇÃO / NAVEGAÇÃO EXTRA ======================

x = "extend_to_line_bounds"
c = "change_selection_noyank"
d = "delete_selection_noyank"
"#" = "toggle_comments"
tab = "move_parent_node_end"
"S-tab" = "move_parent_node_start"

# Setas trocam de buffer em vez de mover o cursor
left = "goto_previous_buffer"
right = "goto_next_buffer"

# Entra em modo de seleção já casando o par de delimitadores
M = ["select_mode", "match_brackets", "normal_mode"]

"C-d" = ["page_cursor_half_down", "align_view_center"]
"C-u" = ["page_cursor_half_up", "align_view_center"]
"C-j" = ["extend_to_line_bounds", "delete_selection", "paste_after"]
"C-k" = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]


# ==========================================================
# MACROS (prefixo G)
# ==========================================================

[keys.normal.G]
j = "@vgj<esc>"
k = "@vgk<esc>"


# ==========================================================
# SPACE COMMANDS
# ==========================================================

[keys.normal.space]

# Space + z
# Limpa arquivos temporários do Helix
z = ":sh rm -f /tmp/helix-*.txt"


# Space + s
# Git status
s = ":echo %sh{git status --short}"


# Space + l
# Git log - últimos 5 commits
l = [
  ":sh git log --oneline -5 > /tmp/helix-git-log.txt 2>&1 || true",
  ":open /tmp/helix-git-log.txt",
]


# Space + d
# Git diff
d = [
  ":sh git diff > /tmp/helix-git-diff.txt 2>&1 || true",
  ":open /tmp/helix-git-diff.txt",
]

# Space + c
# Fecha o buffer atual
c = ":buffer-close"

# Space + Alt+f
# Liga/desliga auto-format
"A-f" = ":toggle auto-format"

# Space + w
# Salva o buffer atual
w = ":write"

# Space + q
# Salva e fecha tudo
q = ":write-quit-all"

# Space + Q
# Fecha tudo sem salvar
Q = ":quit!"

# Space + .
# Liga/desliga respeito ao .gitignore no file-picker
"." = ":toggle file-picker.git-ignore"

# ==========================================================
# RUST
# Prefix: r
# ==========================================================

[keys.normal.r]

# r + r → Cargo run (saída em novo buffer)
r = [
  ":sh cargo run > /tmp/helix-rust-output.txt 2>&1 || true",
  ":open /tmp/helix-rust-output.txt",
]

# r + R → Cargo run --release (saída em novo buffer)
R = [
  ":sh cargo run --release > /tmp/helix-rust-output.txt 2>&1 || true",
  ":open /tmp/helix-rust-output.txt",
]

# r + a → Cargo run com argumentos (saída em novo buffer)
a = [
  ":sh read -p 'Args: ' args; cargo run -- $args > /tmp/helix-rust-output.txt 2>&1 || true",
  ":open /tmp/helix-rust-output.txt",
]

# r + c → Cargo check (saída em novo buffer)
c = [
  ":sh cargo check > /tmp/helix-rust-output.txt 2>&1 || true",
  ":open /tmp/helix-rust-output.txt",
]

# r + b → Cargo build (saída em novo buffer)
b = [
  ":sh cargo build > /tmp/helix-rust-output.txt 2>&1 || true",
  ":open /tmp/helix-rust-output.txt",
]

# r + t → Cargo test (saída em novo buffer)
t = [
  ":sh cargo test > /tmp/helix-rust-output.txt 2>&1 || true",
  ":open /tmp/helix-rust-output.txt",
]

# r + T → Cargo test --nocapture (saída em novo buffer)
T = [
  ":sh cargo test -- --nocapture > /tmp/helix-rust-output.txt 2>&1 || true",
  ":open /tmp/helix-rust-output.txt",
]

# r + l → Cargo clippy (saída em novo buffer)
l = [
  ":sh cargo clippy --all-targets --all-features > /tmp/helix-rust-output.txt 2>&1 || true",
  ":open /tmp/helix-rust-output.txt",
]

# r + f → Cargo fmt
f = ":sh cargo fmt > /tmp/helix-rust-output.txt 2>&1 || true"

# r + F → Cargo fmt --check
F = ":sh cargo fmt -- --check > /tmp/helix-rust-output.txt 2>&1 || true"

# r + d → Cargo doc (saída em novo buffer)
d = [
  ":sh cargo doc --no-deps > /tmp/helix-rust-output.txt 2>&1 || true",
  ":open /tmp/helix-rust-output.txt",
]

# r + x → Cargo clean
x = ":sh cargo clean > /tmp/helix-rust-output.txt 2>&1 || true"

# r + w → Cargo watch test (saída em novo buffer)
w = [
  ":sh cargo watch -x test > /tmp/helix-rust-output.txt 2>&1 || true",
  ":open /tmp/helix-rust-output.txt",
]

# r + n → Cargo run em nova janela WezTerm (interativo)
n = ":sh wezterm cli spawn --new-window cargo run"

# r + m → Cargo run com less (nova janela WezTerm)
m = ":sh wezterm cli spawn --new-window 'cargo run 2>&1 | less'"

# r + g → Git status
g = ":echo %sh{git status --short}"


# ==========================================================
# GO
# Prefix: g
# ==========================================================

[keys.normal.g]

# g + j → vai pra última linha
j = "goto_last_line"

# g + k → vai pro início do arquivo
k = "goto_file_start"

# g + r → Go run (saída em novo buffer)
r = [
  ":sh go run . > /tmp/helix-go-output.txt 2>&1 || true",
  ":open /tmp/helix-go-output.txt",
]

# g + R → Go run com argumentos (saída em novo buffer)
R = [
  ":sh read -p 'Args: ' args; go run . $args > /tmp/helix-go-output.txt 2>&1 || true",
  ":open /tmp/helix-go-output.txt",
]

# g + B → Go build + run binário (saída em novo buffer)
B = [
  ":sh go build -o /tmp/go-run-bin . && /tmp/go-run-bin > /tmp/helix-go-output.txt 2>&1 || true",
  ":open /tmp/helix-go-output.txt",
]

# g + b → Go build (saída em novo buffer)
b = [
  ":sh go build ./... > /tmp/helix-go-output.txt 2>&1 || true",
  ":open /tmp/helix-go-output.txt",
]

# g + p → Go test current package (saída em novo buffer)
p = [
  ":sh go test > /tmp/helix-go-output.txt 2>&1 || true",
  ":open /tmp/helix-go-output.txt",
]

# g + t → Go test entire module (saída em novo buffer)
t = [
  ":sh go test ./... > /tmp/helix-go-output.txt 2>&1 || true",
  ":open /tmp/helix-go-output.txt",
]

# g + d → Go test -race (saída em novo buffer)
d = [
  ":sh go test -race ./... > /tmp/helix-go-output.txt 2>&1 || true",
  ":open /tmp/helix-go-output.txt",
]

# g + v → Go vet (saída em novo buffer)
v = [
  ":sh go vet ./... > /tmp/helix-go-output.txt 2>&1 || true",
  ":open /tmp/helix-go-output.txt",
]

# g + f → Format current file
f = ":sh gofmt -w %{buffer_name}"

# g + x → Go generate
x = ":sh go generate ./... > /tmp/helix-go-output.txt 2>&1 || true"

# g + m → Go mod tidy
m = ":sh go mod tidy > /tmp/helix-go-output.txt 2>&1 || true"

# g + n → Go run em nova janela WezTerm (interativo)
n = ":sh wezterm cli spawn --new-window 'go run .'"

# g + g → Git status
g = ":echo %sh{git status --short}"



# ==========================================================
# SCRATCH / OUTPUT UTILITIES
# Prefix: s
# ==========================================================

[keys.normal.s]

# s + q
# Fecha o buffer atual
q = ":buffer-close!"

# s + Q
# Remove os arquivos temporários de saída
Q = ":sh rm -f /tmp/helix-rust-output.txt /tmp/helix-go-output.txt /tmp/helix-universal-output.txt /tmp/helix-git-log.txt /tmp/helix-git-diff.txt"


# ==========================================================
# INSERT MODE
# ==========================================================

[keys.insert]

# Ctrl+U → apaga a linha até o cursor e abre uma nova acima
"C-u" = ["extend_to_line_bounds", "delete_selection_noyank", "open_above"]

# Ctrl+W → apaga a palavra anterior
"C-w" = ["move_prev_word_start", "delete_selection_noyank"]

# Ctrl+Space → dispara completion manualmente
"C-space" = "completion"

"S-tab" = "move_parent_node_start"


# ==========================================================
# SELECT MODE
# ==========================================================

[keys.select]
tab = "extend_parent_node_end"
"S-tab" = "extend_parent_node_start"

[keys.select.g]
j = "goto_last_line"
k = "goto_file_start"
